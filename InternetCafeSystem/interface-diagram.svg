<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="900" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Microsoft YaHei', sans-serif;">

<rect width="1100" height="900" fill="white"/>

<text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold">系统接口关系图</text>

<!-- ===== 左侧：用户/浏览器 ===== -->
<rect x="50" y="200" width="130" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
<text x="115" y="230" text-anchor="middle" font-size="14" font-weight="bold">浏览器</text>
<text x="115" y="248" text-anchor="middle" font-size="12">（前端页面）</text>

<!-- HTTP接口箭头 -->
<line x1="180" y1="220" x2="280" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
<line x1="280" y1="240" x2="180" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
<text x="230" y="210" text-anchor="middle" font-size="12" fill="#1565c0">HTTP请求</text>
<text x="230" y="258" text-anchor="middle" font-size="12" fill="#1565c0">JSON响应</text>

<!-- ===== 中间：Web服务器 ===== -->
<rect x="290" y="150" width="200" height="280" fill="#fff9e6" stroke="#e65100" stroke-width="2" rx="8"/>
<text x="390" y="180" text-anchor="middle" font-size="15" font-weight="bold">Web服务器</text>
<line x1="300" y1="195" x2="480" y2="195" stroke="#e65100" stroke-width="1"/>

<!-- Controller层 -->
<rect x="310" y="205" width="160" height="40" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
<text x="390" y="230" text-anchor="middle" font-size="13" font-weight="bold">控制层(Controller)</text>

<!-- Service层 -->
<rect x="310" y="265" width="160" height="40" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
<text x="390" y="290" text-anchor="middle" font-size="13" font-weight="bold">业务层(Service)</text>

<!-- DAO层 -->
<rect x="310" y="325" width="160" height="40" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
<text x="390" y="350" text-anchor="middle" font-size="13" font-weight="bold">数据访问层(DAO)</text>

<!-- 内部调用箭头 -->
<line x1="390" y1="245" x2="390" y2="265" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
<line x1="390" y1="305" x2="390" y2="325" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

<text x="400" y="258" font-size="11" fill="#e65100">调用</text>
<text x="400" y="318" font-size="11" fill="#e65100">调用</text>

<!-- 右侧：各功能模块 -->
<rect x="540" y="60" width="140" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
<text x="610" y="88" text-anchor="middle" font-size="13">用户管理模块</text>

<rect x="540" y="130" width="140" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
<text x="610" y="158" text-anchor="middle" font-size="13">上机计费模块</text>

<rect x="540" y="200" width="140" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
<text x="610" y="228" text-anchor="middle" font-size="13">充值结算模块</text>

<rect x="540" y="270" width="140" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
<text x="610" y="298" text-anchor="middle" font-size="13">会员管理模块</text>

<rect x="540" y="340" width="140" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
<text x="610" y="368" text-anchor="middle" font-size="13">系统配置模块</text>

<rect x="540" y="410" width="140" height="45" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5" rx="4"/>
<text x="610" y="438" text-anchor="middle" font-size="13">零食超市模块</text>

<rect x="540" y="480" width="140" height="45" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5" rx="4"/>
<text x="610" y="508" text-anchor="middle" font-size="13">报修管理模块</text>

<rect x="540" y="550" width="140" height="45" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="4"/>
<text x="610" y="578" text-anchor="middle" font-size="13">日志报表模块</text>

<!-- Controller到各模块的箭头 -->
<line x1="490" y1="230" x2="540" y2="82" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="490" y1="230" x2="540" y2="152" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="490" y1="230" x2="540" y2="222" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="490" y1="230" x2="540" y2="292" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="490" y1="230" x2="540" y2="362" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<line x1="490" y1="230" x2="540" y2="432" stroke="#00695c" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
<line x1="490" y1="230" x2="540" y2="502" stroke="#f57f17" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
<line x1="490" y1="230" x2="540" y2="572" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

<!-- 模块间交互箭头 -->
<!-- 用户管理 → 上机计费 -->
<line x1="680" y1="100" x2="730" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="688" y="130" font-size="11" fill="#666">传递用户信息</text>

<!-- 会员管理 → 上机计费 -->
<line x1="680" y1="290" x2="730" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="690" y="220" font-size="11" fill="#666">提供折扣率</text>

<!-- 系统配置 → 上机计费 -->
<line x1="680" y1="360" x2="730" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="692" y="255" font-size="11" fill="#666">提供时段价格</text>

<!-- 上机计费 → 充值结算 -->
<line x1="680" y1="175" x2="730" y2="220" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="698" y="195" font-size="11" fill="#666">传递费用</text>

<!-- 充值结算 → 日志报表 -->
<line x1="680" y1="240" x2="730" y2="570" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="700" y="400" font-size="11" fill="#666">记录操作日志</text>

<!-- 零食超市 → 充值结算 -->
<line x1="680" y1="430" x2="730" y2="240" stroke="#999" stroke-width="1" marker-end="url(#arrowGray)"/>
<text x="710" y="330" font-size="11" fill="#666">扣款</text>

<!-- 底部：数据库 -->
<rect x="370" y="720" width="360" height="60" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="5"/>
<text x="550" y="750" text-anchor="middle" font-size="15" font-weight="bold">MySQL数据库</text>
<text x="550" y="768" text-anchor="middle" font-size="12">（internet_cafe_db）</text>

<!-- DAO到数据库箭头 -->
<line x1="390" y1="365" x2="390" y2="720" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrowPurple)"/>
<line x1="550" y1="365" x2="550" y2="720" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrowPurple)"/>
<text x="400" y="540" font-size="12" fill="#6a1b9a">JDBC / SQL</text>
<text x="400" y="555" font-size="12" fill="#6a1b9a">增删改查</text>

<!-- 箭头定义 -->
<defs>
  <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
  </marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
  </marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#00695c"/>
  </marker>
  <marker id="arrowYellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#f57f17"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
  </marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6a1b9a"/>
  </marker>
</defs>

</svg>