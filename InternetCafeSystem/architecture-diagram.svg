<rect x="165" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="200" y="502" text-anchor="middle" font-size="13">用户管理</text>

<rect x="250" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="285" y="502" text-anchor="middle" font-size="13">充值管理</text>

<rect x="335" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="370" y="502" text-anchor="middle" font-size="13">上网管理</text>

<rect x="420" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="455" y="502" text-anchor="middle" font-size="13">会员管理</text>

<rect x="505" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="540" y="502" text-anchor="middle" font-size="13">零食超市</text>

<rect x="590" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="625" y="502" text-anchor="middle" font-size="13">报修管理</text>

<rect x="675" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="710" y="502" text-anchor="middle" font-size="13">报表统计</text>

<rect x="760" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="795" y="502" text-anchor="middle" font-size="13">系统日志</text>

<rect x="845" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="880" y="502" text-anchor="middle" font-size="13">上网单价</text>

<rect x="930" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="965" y="502" text-anchor="middle" font-size="13">文件上传</text>

<rect x="1015" y="460" width="70" height="75" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="1050" y="502" text-anchor="middle" font-size="13">我的信息</text>

<!-- 各模块竖线到横线 -->
<line x1="115" y1="535" x2="115" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="200" y1="535" x2="200" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="285" y1="535" x2="285" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="370" y1="535" x2="370" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="455" y1="535" x2="455" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="540" y1="535" x2="540" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="625" y1="535" x2="625" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="710" y1="535" x2="710" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="795" y1="535" x2="795" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="880" y1="535" x2="880" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="965" y1="535" x2="965" y2="550" stroke="#333" stroke-width="1.5"/>
<line x1="1050" y1="535" x2="1050" y2="550" stroke="#333" stroke-width="1.5"/>

</svg>
