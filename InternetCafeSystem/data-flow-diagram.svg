  <path d="M 130 488 L 260 488 L 260 285 L 245 285" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="195" y="503" text-anchor="middle" font-size="10" fill="#000">上机</text>
  
  <path d="M 130 488 L 265 488 L 265 485 L 245 485" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="198" y="515" text-anchor="middle" font-size="10" fill="#000">会员</text>
  
  <path d="M 130 488 L 485 488 L 485 135 L 505 135" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="305" y="478" text-anchor="middle" font-size="10" fill="#000">购买</text>
  
  <path d="M 130 488 L 480 488 L 480 255 L 505 255" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="303" y="470" text-anchor="middle" font-size="10" fill="#000">报修</text>
  
  <!-- 数据流 - 处理到数据存储 -->
