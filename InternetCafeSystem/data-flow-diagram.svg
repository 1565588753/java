  <path d="M 395 185 L 770 185 L 770 109 L 820 109" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 395 285 L 760 285 L 760 199 L 820 199" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 395 385 L 750 385 L 750 244 L 820 244" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 395 485 L 740 485 L 740 154 L 820 154" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  
  <path d="M 655 135 L 730 135 L 730 289 L 820 289" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 655 255 L 720 255 L 720 379 L 820 379" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
