<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <rect width="1200" height="800" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">网吧计费管理系统 - 数据流图</text>
  
  <!-- 外部实体：管理员 -->
  <rect x="50" y="100" width="140" height="50" rx="5" ry="5" fill="#e6f3ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-size="16" fill="#333">管理员</text>
  
  <!-- 外部实体：用户 -->
  <rect x="50" y="250" width="140" height="50" rx="5" ry="5" fill="#e6f3ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="280" text-anchor="middle" font-size="16" fill="#333">用户</text>
  
  <!-- 处理过程 -->
  <ellipse cx="400" cy="125" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P1</text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#333">登录管理</text>
  
  <ellipse cx="400" cy="275" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P2</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#333">用户管理</text>
  
  <ellipse cx="600" cy="125" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P3</text>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#333">上机计费</text>
  
  <ellipse cx="600" cy="275" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P4</text>
  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#333">充值管理</text>
  
  <ellipse cx="400" cy="425" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P5</text>
  <text x="400" y="440" text-anchor="middle" font-size="11" fill="#333">会员管理</text>
  
  <ellipse cx="600" cy="425" rx="75" ry="35" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P6</text>
  <text x="600" y="440" text-anchor="middle" font-size="11" fill="#333">报表统计</text>
  
  <!-- 数据存储 -->
  <g transform="translate(850, 80)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">管理员表</text>
  </g>
  
  <g transform="translate(850, 140)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">用户表</text>
  </g>
  
  <g transform="translate(850, 200)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">会员等级表</text>
  </g>
  
  <g transform="translate(850, 260)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">上机记录表</text>
  </g>
  
  <g transform="translate(850, 320)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">充值记录表</text>
  </g>
  
  <g transform="translate(850, 380)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">消费记录表</text>
  </g>
  
  <g transform="translate(850, 440)">
    <rect x="0" y="0" width="150" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="0" x2="160" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <line x1="150" y1="40" x2="160" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" fill="#333">系统日志表</text>
  </g>
  
  <!-- 数据流连线 -->
  <!-- 管理员 -> P1登录管理 -->
  <path d="M 190 125 L 320 125" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="118" text-anchor="middle" font-size="10" fill="#333">登录请求</text>
  
  <!-- 用户 -> P1登录管理 -->
  <path d="M 190 275 L 320 155" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="200" text-anchor="middle" font-size="10" fill="#333">登录请求</text>
  
  <!-- P1 -> 管理员表 -->
  <path d="M 475 125 L 850 100" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="105" text-anchor="middle" font-size="10" fill="#333">认证信息</text>
  
  <!-- P1 -> 系统日志表 -->
  <path d="M 475 125 L 750 125 L 750 460 L 850 460" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="610" y="115" text-anchor="middle" font-size="10" fill="#333">日志记录</text>
  
  <!-- 管理员 -> P2用户管理 -->
  <path d="M 190 125 L 320 275" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="195" text-anchor="middle" font-size="10" fill="#333">用户操作</text>
  
  <!-- P2 -> 用户表 -->
  <path d="M 475 275 L 850 160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="210" text-anchor="middle" font-size="10" fill="#333">用户数据</text>
  
  <!-- P2 -> 会员等级表 -->
  <path d="M 475 275 L 850 220" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="240" text-anchor="middle" font-size="10" fill="#333">会员等级</text>
  
  <!-- P2 -> 系统日志表 -->
  <path d="M 475 275 L 700 275 L 700 460 L 850 460" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  
  <!-- 管理员 -> P3上机计费 -->
  <path d="M 190 125 L 520 125" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="355" y="115" text-anchor="middle" font-size="10" fill="#333">上机指令</text>
  
  <!-- 用户 -> P3上机计费 -->
  <path d="M 190 275 L 520 145" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="355" y="200" text-anchor="middle" font-size="10" fill="#333">上机操作</text>
  
  <!-- P3 -> 上机记录表 -->
  <path d="M 675 125 L 850 280" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="760" y="195" text-anchor="middle" font-size="10" fill="#333">上机记录</text>
  
  <!-- P3 -> 消费记录表 -->
  <path d="M 675 125 L 850 400" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="760" y="255" text-anchor="middle" font-size="10" fill="#333">消费记录</text>
  
  <!-- 管理员 -> P4充值管理 -->
  <path d="M 190 125 L 520 275" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="355" y="190" text-anchor="middle" font-size="10" fill="#333">充值操作</text>
  
  <!-- P4 -> 充值记录表 -->
  <path d="M 675 275 L 850 340" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="760" y="300" text-anchor="middle" font-size="10" fill="#333">充值记录</text>
  
  <!-- P4 -> 用户表 -->
  <path d="M 675 275 L 750 275 L 750 160 L 850 160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="265" text-anchor="middle" font-size="10" fill="#333">更新余额</text>
  
  <!-- 管理员 -> P5会员管理 -->
  <path d="M 190 125 L 320 425" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="270" text-anchor="middle" font-size="10" fill="#333">会员操作</text>
  
  <!-- P5 -> 会员等级表 -->
  <path d="M 475 425 L 850 220" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="315" text-anchor="middle" font-size="10" fill="#333">等级设置</text>
  
  <!-- P5 -> 用户表 -->
  <path d="M 475 425 L 850 160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="285" text-anchor="middle" font-size="10" fill="#333">会员信息</text>
  
  <!-- 管理员 -> P6报表统计 -->
  <path d="M 190 125 L 520 425" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="355" y="265" text-anchor="middle" font-size="10" fill="#333">查询请求</text>
  
  <!-- P6 -> 用户表 -->
  <path d="M 675 425 L 850 160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="760" y="285" text-anchor="middle" font-size="10" fill="#333">查询数据</text>
  
  <!-- P6 -> 上机记录表 -->
  <path d="M 675 425 L 850 280" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  
  <!-- P6 -> 充值记录表 -->
  <path d="M 675 425 L 850 340" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  
  <!-- P6 -> 消费记录表 -->
  <path d="M 675 425 L 850 400" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  
  <!-- 图例 -->
  <g transform="translate(80, 530)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">图例说明</text>
    
    <rect x="0" y="25" width="60" height="30" rx="5" ry="5" fill="#e6f3ff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="43" font-size="13" fill="#333">外部实体</text>
    
    <ellipse cx="180" cy="40" rx="35" ry="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="220" y="43" font-size="13" fill="#333">处理过程</text>
    
    <g transform="translate(320, 20)">
      <rect x="0" y="0" width="60" height="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <line x1="60" y1="0" x2="70" y2="0" stroke="#16a34a" stroke-width="2"/>
      <line x1="70" y1="0" x2="70" y2="30" stroke="#16a34a" stroke-width="2"/>
      <line x1="60" y1="30" x2="70" y2="30" stroke="#16a34a" stroke-width="2"/>
    </g>
    <text x="400" y="43" font-size="13" fill="#333">数据存储</text>
    
    <line x1="0" y1="75" x2="60" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="70" y="80" font-size="13" fill="#333">数据流</text>
    
    <line x1="220" y1="75" x2="280" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="290" y="80" font-size="13" fill="#333">查询数据流</text>
  </g>
</svg>