# ==========================================
# 网吧计费管理系统 - 应用配置文件
# ==========================================

# 数据库连接配置
db.url=jdbc:mysql://localhost:3306/internet_cafe_db?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
db.username=root
db.password=123456
db.driver=com.mysql.cj.jdbc.Driver

# Druid连接池配置
db.initialSize=5
db.minIdle=5
db.maxActive=20
db.maxWait=60000
db.timeBetweenEvictionRunsMillis=60000
db.minEvictableIdleTimeMillis=300000
db.validationQuery=SELECT 1
db.testWhileIdle=true
db.testOnBorrow=false
db.testOnReturn=false

# 计费规则配置
charge.normalPrice=5.0
charge.vipDiscount=0.8
charge.svipDiscount=0.6
charge.timerInterval=1000

# 系统配置
system.appName=网吧计费管理系统
system.version=1.0.0